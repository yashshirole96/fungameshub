<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Betting Game</title>
    <style>body {
        font-family: 'Arial', sans-serif;
        background-color: #7cdee5;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .container {
        background-color: #42797d;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(255, 111, 97, 0.6);
        text-align: center;
        width: 400px;
    }
    h1 {
        font-size: 24px;
        color: #ff6f61;
    }
    .score {
        font-size: 20px;
        color: #ffd700;
        margin: 10px 0;
    }
    .balance {
        font-size: 18px;
        color: #ff6f61;
    }
    input {
        padding: 10px;
        font-size: 16px;
        width: 80px;
        background-color: #444;
        color: white;
        text-align: center;
    }
    button {
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: #ff6f61;
        color: white;
        margin: 5px;
    }
    button:hover {
        background-color: #ff4a3d;
    }
    .dice {
        font-size: 60px;
        color: #ffcc00;
        margin: 20px auto;
        transition: transform 0.5s ease-in-out;
    }
    .rolling {
        animation: rollDice 0.5s infinite linear;
    }
    @keyframes rollDice {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>Dice Betting Game</h1>
        <p class="score">Score: <span id="score">0</span></p>
        <p class="balance">Balance: <span id="balance">100</span> Coins</p>
        <p>Enter Bet Amount: <input type="number" id="bet-amount" min="1" value="10"></p>
        <p>Choose Your Bet:</p>
        <button onclick="bet('high')">High (4-6)</button>
        <button onclick="bet('low')">Low (1-3)</button>
        <p>Or Guess a Number (1-6): <input type="number" id="guess-number" min="1" max="6"> <button onclick="bet('number')">Bet</button></p>
        <div class="dice" id="dice">🎲</div>
        <div class="result" id="result"></div>
    </div>
    <script>
       let balance = 100;
let score = 0;

function bet(choice) {
    let betAmount = parseInt(document.getElementById("bet-amount").value);
    if (betAmount > balance || betAmount <= 0) {
        alert("Invalid bet amount!");
        return;
    }

    let diceElement = document.getElementById("dice");
    diceElement.style.animation = "roll 1s ease-out";

    setTimeout(() => {
        let dice = Math.floor(Math.random() * 6) + 1;
        diceElement.innerText = dice;
        diceElement.style.animation = "none";

        let win = false, multiplier = 0;

        if (choice === "high" && dice >= 4) {
            win = true;
            multiplier = 2;
        } else if (choice === "low" && dice <= 3) {
            win = true;
            multiplier = 2;
        } else if (choice === "number") {
            let guess = parseInt(document.getElementById("guess-number").value);
            if (guess === dice) {
                win = true;
                multiplier = 6;
            }
        }

        if (win) {
            balance += betAmount * (multiplier - 1);
            document.getElementById("result").innerText = `You won! Dice: ${dice}`;
            
            // **Calculate Score (1 Point for Every 10 Coins Bet)**
            let scoreToAdd = Math.floor(betAmount / 10);
            if (scoreToAdd > 0) {
                score += scoreToAdd;
                updateScore(scoreToAdd); // Update the score in the database
            }
        } else {
            balance -= betAmount;
            document.getElementById("result").innerText = `You lost! Dice: ${dice}`;
        }

        document.getElementById("balance").innerText = balance;
        document.getElementById("score").innerText = score;

        if (balance <= 0) {
            alert("Game Over! You ran out of coins.");
            balance = 100;
            score = 0;
            document.getElementById("balance").innerText = balance;
            document.getElementById("score").innerText = score;
            updateScore(0); // Reset score in DB
        }
    }, 1000);
}

// **Fixed AJAX Request for Score Update**
function updateScore(points) {
    fetch('update_score.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `score=${points}`
    })
    .then(response => response.text())
    .then(data => console.log("Server Response:", data))
    .catch(error => console.error('Error:', error));
}

    </script>
</body>
</html>
