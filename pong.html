<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
}

#game-container {
    border: 2px solid #000;
}

canvas {
    display: block;
}
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Paddle settings
    const paddleWidth = 10;
    const paddleHeight = 100;
    const paddleSpeed = 7;

    // Ball settings
    const ballRadius = 10;
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 5;
    let ballSpeedY = 5;

    // Player paddle
    let playerPaddleY = (canvas.height - paddleHeight) / 2;
    let playerPaddleDY = 0;

    // AI paddle
    let aiPaddleY = (canvas.height - paddleHeight) / 2;

    // Score
    let playerScore = 0;
    let aiScore = 0;

    function drawPaddle(x, y) {
        ctx.fillStyle = '#000';
        ctx.fillRect(x, y, paddleWidth, paddleHeight);
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
        ctx.closePath();
    }

    function drawScore() {
        ctx.font = '45px Arial';
        ctx.fillStyle = '#000';
        ctx.fillText(playerScore, canvas.width / 4, canvas.height / 5);
        ctx.fillText(aiScore, 3 * canvas.width / 4, canvas.height / 5);
    }

    function movePaddle(event) {
        if (event.key === 'ArrowUp') {
            playerPaddleDY = -paddleSpeed;
        } else if (event.key === 'ArrowDown') {
            playerPaddleDY = paddleSpeed;
        }
    }

    function stopPaddle(event) {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
            playerPaddleDY = 0;
        }
    }

    function moveAI() {
        if (ballY < aiPaddleY + paddleHeight / 2) {
            aiPaddleY -= paddleSpeed;
        } else {
            aiPaddleY += paddleSpeed;
        }
    }

    function update() {
        // Update player paddle position
        playerPaddleY += playerPaddleDY;
        if (playerPaddleY < 0) playerPaddleY = 0;
        if (playerPaddleY > canvas.height - paddleHeight) playerPaddleY = canvas.height - paddleHeight;

        // Update AI paddle position
        if (aiPaddleY < 0) aiPaddleY = 0;
        if (aiPaddleY > canvas.height - paddleHeight) aiPaddleY = canvas.height - paddleHeight;

        // Update ball position
        ballX += ballSpeedX;
        ballY += ballSpeedY;

        // Ball collision with top and bottom walls
        if (ballY + ballRadius > canvas.height || ballY - ballRadius < 0) {
            ballSpeedY = -ballSpeedY;
        }

        // Ball collision with paddles
        if (ballX - ballRadius < paddleWidth) {
            if (ballY > playerPaddleY && ballY < playerPaddleY + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            } else if (ballX - ballRadius < 0) {
                aiScore++;
                resetBall();
            }
        } else if (ballX + ballRadius > canvas.width - paddleWidth) {
            if (ballY > aiPaddleY && ballY < aiPaddleY + paddleHeight) {
                ballSpeedX = -ballSpeedX;
            } else if (ballX + ballRadius > canvas.width) {
                playerScore++;
                resetBall();
            }
        }
    }

    function resetBall() {
        ballX = canvas.width / 2;
        ballY = canvas.height / 2;
        ballSpeedX = -ballSpeedX;
        ballSpeedY = 5;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawPaddle(0, playerPaddleY);
        drawPaddle(canvas.width - paddleWidth, aiPaddleY);
        drawBall();
        drawScore();
    }

    function gameLoop() {
        update();
        moveAI();
        draw();
        requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', movePaddle);
    document.addEventListener('keyup', stopPaddle);
    gameLoop();
});
    </script>
</body>
</html>
