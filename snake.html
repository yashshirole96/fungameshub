<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Game</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: #7cdee5;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 2rem;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* Score Display */
        #score {
            font-size: 1.5rem;
            margin-bottom: 10px;
            background: #ff6f61;
            padding: 5px 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Canvas Styling */
        canvas {
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            background: #2a2a40;
            margin-bottom: 10px;
        }

        /* Mobile Controls */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            gap: 5px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background: #ff6f61;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: #e65a50;
            transform: scale(1.1);
        }

        .empty-btn {
            width: 50px;
            height: 50px;
            visibility: hidden;
        }

        
    </style>
</head>
<body>
    <h1>🐍 Snake Game</h1>
    <div id="score">Score: 0</div>
    <canvas id="board"></canvas>

    <!-- Mobile Controls -->
    <div class="controls">
        <div class="control-row">
            <button class="empty-btn"></button>
            <button class="control-btn" onclick="changeDirection('ArrowUp')">⬆</button>
            <button class="empty-btn"></button>
        </div>
        <div class="control-row">
            <button class="control-btn" onclick="changeDirection('ArrowLeft')">⬅</button>
            <button class="control-btn" onclick="changeDirection('ArrowDown')">⬇</button>
            <button class="control-btn" onclick="changeDirection('ArrowRight')">➡</button>
        </div>
    </div>

    <script>
        // Fetch username from dashboard.php
        fetch("dashboard.php")
            .then(response => response.text())
            .then(username => {
                sessionStorage.setItem("username", username.trim());
                console.log("Username:", username);
            })
            .catch(error => {
                console.error("Error fetching username:", error);
                alert("Failed to fetch username. Please log in.");
            });

        // Board settings
        var blockSize = 25;
        var rows = 20;
        var cols = 20;
        var board, context;

        // Snake settings
        var snakeX = blockSize * 5;
        var snakeY = blockSize * 5;
        var velocityX = 0;
        var velocityY = 0;
        var snakeBody = [];

        // Food settings
        var foodX, foodY;

        // Game variables
        var gameOver = false;
        var score = 0;

        window.onload = function() {
            board = document.getElementById("board");
            board.height = rows * blockSize;
            board.width = cols * blockSize;
            context = board.getContext("2d");

            placeFood();
            document.addEventListener("keydown", (e) => changeDirection(e.code));

            setInterval(update, 1000 / 10);
        };

        function update() {
            if (gameOver) return;

            // Background
            context.fillStyle = "#2a2a40";
            context.fillRect(0, 0, board.width, board.height);

            // Draw Food
            context.fillStyle = "red";
            context.beginPath();
            context.arc(foodX + blockSize / 2, foodY + blockSize / 2, blockSize / 2, 0, Math.PI * 2);
            context.fill();

            // Eat food
            if (snakeX === foodX && snakeY === foodY) {
                snakeBody.push([foodX, foodY]);
                score++;
                document.getElementById("score").innerText = "Score: " + score;
                placeFood();
            }

            // Move snake body
            for (let i = snakeBody.length - 1; i > 0; i--) {
                snakeBody[i] = snakeBody[i - 1];
            }
            if (snakeBody.length) {
                snakeBody[0] = [snakeX, snakeY];
            }

            // Move snake
            snakeX += velocityX * blockSize;
            snakeY += velocityY * blockSize;

            // Draw snake
            context.fillStyle = "lime";
            context.fillRect(snakeX, snakeY, blockSize, blockSize);
            for (let i = 0; i < snakeBody.length; i++) {
                context.fillRect(snakeBody[i][0], snakeBody[i][1], blockSize, blockSize);
            }

            // Game Over Conditions
            if (snakeX < 0 || snakeX >= cols * blockSize || snakeY < 0 || snakeY >= rows * blockSize) {
                endGame();
            }

            for (let i = 0; i < snakeBody.length; i++) {
                if (snakeX === snakeBody[i][0] && snakeY === snakeBody[i][1]) {
                    endGame();
                }
            }
        }

        function changeDirection(key) {
            if (key === "ArrowUp" && velocityY !== 1) {
                velocityX = 0;
                velocityY = -1;
            } else if (key === "ArrowDown" && velocityY !== -1) {
                velocityX = 0;
                velocityY = 1;
            } else if (key === "ArrowLeft" && velocityX !== 1) {
                velocityX = -1;
                velocityY = 0;
            } else if (key === "ArrowRight" && velocityX !== -1) {
                velocityX = 1;
                velocityY = 0;
            }
        }

        function placeFood() {
            foodX = Math.floor(Math.random() * cols) * blockSize;
            foodY = Math.floor(Math.random() * rows) * blockSize;
        }

        function endGame() {
            gameOver = true;
            let username = sessionStorage.getItem("username");

            if (!username) {
                alert("User not logged in!");
                return;
            }

            // Send score to database
            fetch("update_score.php", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "username=" + encodeURIComponent(username) + "&score=" + score
            });

            setTimeout(() => alert(`💀 Game Over! Your score: ${score}`), 100);
        }
    </script>
</body>
</html>
